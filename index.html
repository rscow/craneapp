<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crane Operator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud" aria-label="Game status">
        <div class="hud-item">
          <span class="hud-label">TIME</span>
          <span id="timer" class="hud-value">02:00</span>
        </div>
        <h1>CRANE OPERATOR</h1>
        <div class="hud-item hud-item-right">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">000000</span>
        </div>
      </header>

      <section class="game-stage" aria-label="Crane scene and load chart">
        <aside class="load-chart" aria-label="Crane load chart">
          <h2>LOAD CHART</h2>
          <table>
            <thead>
              <tr>
                <th>Radius</th>
                <th>Capacity</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>50 ft</td><td>20,000 lb</td></tr>
              <tr><td>75 ft</td><td>13,000 lb</td></tr>
              <tr><td>100 ft</td><td>9,000 lb</td></tr>
              <tr><td>125 ft</td><td>7,000 lb</td></tr>
              <tr><td>150 ft</td><td>5,500 lb</td></tr>
            </tbody>
          </table>
        </aside>

        <canvas
          id="game"
          width="960"
          height="540"
          aria-label="Tower crane construction scene"
        ></canvas>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
